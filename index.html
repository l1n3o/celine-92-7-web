<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
        }

        .website-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }

        .music-frame {
            position: fixed;
            bottom: 0;
            right: 25px;
            width: 560px;
            height: 100px;
            border: none;
            z-index: 1000;
        }
        
        
    </style>
</head>

<body>

    <iframe
        class="website-frame"
        src="home.html"
        name="website-content">
    </iframe>

    <iframe
        class="music-frame"
        src="music.html"
        title="Background music player">
    </iframe>

</body>
</html>
